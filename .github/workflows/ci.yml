name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint and test frontend
  frontend:
    name: Frontend (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ToDoApp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ToDoApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # Build and test Tauri app on Linux
  tauri-linux:
    name: Tauri Linux Build
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: ./ToDoApp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ToDoApp/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workdir: ./ToDoApp/src-tauri

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app (Linux)
        run: |
          source "$HOME/.cargo/env"
          npx tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: |
            ToDoApp/src-tauri/target/release/bundle/deb/*.deb
            ToDoApp/src-tauri/target/release/bundle/rpm/*.rpm
            ToDoApp/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

  # Build Tauri app on Windows
  tauri-windows:
    name: Tauri Windows Build
    runs-on: windows-latest
    needs: frontend
    defaults:
      run:
        working-directory: ./ToDoApp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ToDoApp/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workdir: ./ToDoApp/src-tauri

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app (Windows)
        run: |
          npx tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            ToDoApp/src-tauri/target/release/bundle/nsis/*.exe
            ToDoApp/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

  # Build Tauri app on macOS
  tauri-macos:
    name: Tauri macOS Build
    runs-on: macos-latest
    needs: frontend
    defaults:
      run:
        working-directory: ./ToDoApp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ToDoApp/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workdir: ./ToDoApp/src-tauri

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app (macOS)
        run: |
          npx tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos
          path: |
            ToDoApp/src-tauri/target/release/bundle/dmg/*.dmg
            ToDoApp/src-tauri/target/release/bundle/macos/*.app
          retention-days: 7

  # Create release on tag push
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [tauri-linux, tauri-windows, tauri-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.msi" -o -name "*.dmg" | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: FloTask ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Security scan for Windows build
  security-scan:
    name: Security Scan (Windows)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: ./ToDoApp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ToDoApp/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app (Windows)
        run: npx tauri build

      - name: Scan for viruses with Windows Defender
        run: |
          $installer = Get-ChildItem "ToDoApp/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($installer) {
            Write-Host "Scanning $($installer.FullName) with Windows Defender..."
            Start-Process -FilePath "C:\Program Files\Windows Defender\MpCmdRun.exe" -ArgumentList "-Scan -ScanType 3 -File `$installer.FullName" -Wait -NoNewWindow
            Write-Host "Scan complete"
          }
        shell: powershell