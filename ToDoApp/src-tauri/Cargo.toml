[package]
name = "flotask"
version = "0.1.0"
description = "FloTask — AI-powered task manager: type or speak naturally and tasks schedule themselves. Pomodoro, alarms, scratchpad."
authors = ["Ash"]
license = "MIT"
repository = "https://github.com/ghoulraider13-rgb/FloTask"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "flotask_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
